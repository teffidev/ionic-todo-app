<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Todo App</title>

    <!-- viewport-fit=cover permite que el contenido vaya detrás de la barra de estado -->
    <!-- El CSS luego usa env(safe-area-inset-*) para no tapar contenido interactivo -->
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#070B18" />

    <!-- Outfit: tipografía geométrica moderna, muy diferente a Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <base href="/" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
